
# ==== Config minima e funcional para o laboratorio (loopback) ====
var RULE_PATH /etc/snort/rules
ipvar HOME_NET 127.0.0.0/8
ipvar EXTERNAL_NET any
portvar HTTP_PORTS 80

config checksum_mode: none
config logdir: /var/log/snort_test

include /etc/snort/classification.config
include /etc/snort/reference.config

# --- Preprocessadores necessarios para HTTP e fluxo ---
preprocessor frag3_global: max_frags 65536
preprocessor frag3_engine: policy linux
preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp no
preprocessor stream5_tcp: policy linux, ports both 80 22
preprocessor stream5_udp: timeout 30
preprocessor http_inspect: global iis_unicode_map /etc/snort/unicode.map 1252
preprocessor http_inspect_server: server default profile all ports { 80 }

# --- Saidas: alerta legivel ---
output alert_fast: alert_fast.log

include $RULE_PATH/local.rules